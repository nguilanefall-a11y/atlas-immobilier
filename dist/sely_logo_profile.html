<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sely Logo Export</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f4f6;
        }
        .export-container {
            width: 800px;
            height: 800px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 2rem;
            transform: scale(2.5);
        }
        .monogram {
            width: 5rem;
            height: 5rem;
            border: 3px solid #1e293b; /* Equivalent to primary */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }
        .monogram span {
            font-family: 'Playfair Display', serif;
            font-weight: 500;
            font-size: 3rem;
            position: relative;
            top: -2px;
        }
        .text-part {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }
        .brand {
            font-family: 'Playfair Display', serif;
            font-weight: 500;
            letter-spacing: 0.3em;
            font-size: 2.5rem;
            color: #1e293b;
            margin-bottom: 0.25rem;
        }
        .city {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            text-align: center;
            color: #e11d48; /* Equivalent to secondary */
        }
    </style>
</head>
<body>
    <div class="export-container" id="logo-node">
        <div class="logo-wrapper">
            <div class="monogram">
                <span>S</span>
            </div>
            <div class="text-part">
                <span class="brand">SELY</span>
                <span class="city">Paris</span>
            </div>
        </div>
    </div>
</body>
</html>
