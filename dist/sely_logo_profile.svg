<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
    <rect width="800" height="800" fill="#ffffff"/>
    <g transform="translate(180, 310) scale(4)">
        <!-- Box -->
        <rect x="0" y="0" width="44" height="44" fill="none" stroke="#1e293b" stroke-width="1.5"/>
        <!-- S -->
        <text x="22" y="32" font-family="'Playfair Display', serif" font-weight="500" font-size="32" text-anchor="middle" fill="#1e293b">S</text>
        
        <!-- SELY text -->
        <text x="60" y="24" font-family="'Playfair Display', serif" font-weight="500" font-size="20" letter-spacing="4.5" fill="#1e293b">SELY</text>
        
        <!-- PARIS text -->
        <text x="60" y="38" font-family="'Inter', sans-serif" font-weight="600" font-size="7" letter-spacing="2.5" text-transform="uppercase" fill="#e11d48">Paris</text>
    </g>
